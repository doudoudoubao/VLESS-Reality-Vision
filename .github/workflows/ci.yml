name: ci

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 每周一用最新 Xray 内核重跑一遍。脚本线上装的永远是最新版，
    # 上游一旦改了行为，这里会先变红，而不是等用户装挂了才发现
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: 语法检查
        run: for f in install.sh tests/*.sh; do bash -n "$f"; done
      - name: 静态检查
        run: shellcheck -S warning install.sh tests/*.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 单元测试（非 root，不改动系统）
        run: bash tests/unit.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 升级路径测试要以 origin/main 作为"用户当前在用的版本"
      - name: 端到端测试（真实安装与卸载，runner 是一次性的）
        run: sudo bash tests/e2e.sh
