name: shellcheck

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: 语法检查
        run: bash -n install.sh
      - name: 静态检查
        run: shellcheck -S warning install.sh
